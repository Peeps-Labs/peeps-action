# The go line's workflow (e5 plan §7, v2 §7, v3 §4 and §7). This is its SOURCE, kept outside
# .github/workflows so peeps-action never runs it. The Peeps-owned fixture repository carries a
# copy at .github/workflows/load-golive.yml that differs from this file in one place only: the
# all-zero `ref` below, replaced with the peeps-action commit under test. Peeps registers that
# copy's blob digest as the fixture's recipe; workflow.yml.sha256 beside this file pins these bytes.
#
# It cannot aim load anywhere but the harness:
#   - it runs only in the fixture repository, on a first attempt, by dispatch;
#   - Peeps' origin and the sink hosts are written here, not taken from an input;
#   - the only inputs are the grant reference Peeps dispatched with and the runner image;
#   - dist/load.js refuses a grant naming any host off PEEPS_LOAD_SINK_HOSTS before the jail
#     starts, and Peeps admits only the harness repository and sink hosts (P4).
#
# The fixture repository holds the app (package.json, package-lock.json, the journeys and
# peeps/load/golive.workload.yaml) and, under .peeps-load/npm-cache, an npm cache holding every
# tarball the lockfile names: the pre-claim install is offline (e5 plan v3 §2.10).
name: Peeps load go line

on:
  workflow_dispatch:
    inputs:
      peeps-load-grant:
        description: The grant reference Peeps dispatched this run with
        required: true
        type: string
      runner:
        description: The hosted runner image
        required: true
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-22.04

permissions:
  contents: read
  id-token: write

jobs:
  load:
    # PLACEHOLDER: the fixture repository's name, to confirm before the fixture copy is registered.
    if: github.repository == 'Peeps-Labs/peeps-load-fixture' && github.run_attempt == 1
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: app
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: Peeps-Labs/peeps-action
          ref: 0000000000000000000000000000000000000000
          path: action
          persist-credentials: false

      # The pinned toolchain the load install accepts (SUPPORTED_TOOLCHAIN in src/load/install.ts).
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"

      - name: Load run
        run: node "$GITHUB_WORKSPACE/action/dist/load.js"
        env:
          PEEPS_URL: https://dev.peepsai.com
          # PLACEHOLDER: the harness sink host, to confirm before the fixture copy is registered.
          PEEPS_LOAD_SINK_HOSTS: sink.load-harness.peeps.dev
          PEEPS_LOAD_GRANT: ${{ inputs.peeps-load-grant }}
          PEEPS_LOAD_WORKSPACE: ${{ github.workspace }}/app
          PEEPS_LOAD_WORKLOAD: peeps/load/golive.workload.yaml
          # PLACEHOLDER: where the fixture keeps the recipe's npm cache, to confirm.
          PEEPS_LOAD_NPM_CACHE: ${{ github.workspace }}/app/.peeps-load/npm-cache
          PEEPS_LOAD_CHECK_RUN_ID: ${{ job.check_run_id }}
          PEEPS_LOAD_RESULT_FILE: ${{ runner.temp }}/peeps-load-result.json

      # The run's own record: every renewal's latency, the closed outcome and the evidence state.
      # No token is in it.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: peeps-load-result-${{ inputs.runner }}
          path: ${{ runner.temp }}/peeps-load-result.json
          if-no-files-found: warn
