# Reviewed workload for Peeps load testing (docs: Load testing).
# Nothing runs until an Owner turns load on for an environment.
schema: 1
journey: { module: tests/shared/search.ts, export: searchCatalogue }
cohort:
  kind: protocol
  demand: users
  stages:
    - { name: Warm up, ramp: 20s, from: 0, to: 2 }
    - { name: Hold, hold: 1m, users: 2 }
    - { name: Wind down, ramp: 20s, from: 2, to: 0 }
  pacing: { every: 5s }
requests: { per_journey_max: 20 }
on_reduced: refuse
