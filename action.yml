name: "Peeps"
description: "Runs your Playwright, pytest or Appium (WebdriverIO) tests in your own CI and reports results to Peeps. Your repository stores no Peeps secret: the job authenticates with GitHub's OIDC token. See SECURITY.md for exactly what is sent to Peeps and what Peeps can do on your runner."
author: "Peeps Labs"
branding:
  icon: "git-branch"
  color: "green"
inputs:
  mode:
    description: "inventory | run | report | agent | ci (default: decide from the event) | attach-start | attach-finish (report your own test step's run, its command and reporters unchanged; these two never fail the job)"
    required: false
    default: "ci"
  session-id:
    description: "Session id Peeps passes to workflow_dispatch. Required by run and agent modes; unused by inventory and report"
    required: false
  config:
    description: "Path to the Playwright config (pytest: the ini file passed as -c; appium: the WebdriverIO config, e.g. wdio.android.conf.ts), relative to working-directory"
    required: false
  framework:
    description: "playwright | pytest | appium | auto (default: appium when working-directory has a WebdriverIO config (wdio.conf.ts/.js/.mjs/.cjs, or wdio.<name>.conf.*) and no Playwright config; pytest when it has pytest.ini, conftest.py or a pyproject.toml configuring pytest and no Playwright config; otherwise playwright)"
    required: false
    default: "auto"
  device-tools:
    description: "agent mode, Appium suite only: start Appium and a device session and offer Peeps the device_* tools (page source, screenshot, find, tap, type, swipe, contexts, app, logs). Peeps passes it on dispatch when its agent explores the app (default: false)"
    required: false
    default: "false"
  working-directory:
    description: "Directory to run the tests in, relative to the repository root (default: the repository root)"
    required: false
  preview:
    description: "vercel: on a pull request, wait for that pull request's Vercel preview and set BASE_URL to it (needs `deployments: read` and `statuses: read`). A BASE_URL the workflow sets wins"
    required: false
  preview-project:
    description: "With preview, the Vercel project whose preview to test, for a repository that deploys several (the <name> of the deployment environment \"Preview – <name>\")"
    required: false
  preview-timeout:
    description: "Seconds to wait for the preview (default 600)"
    required: false
    default: "600"
  app-start:
    description: "Server evidence (recorded pushes, with app-ready-url): the command that starts your app from working-directory, e.g. `npx next start -p 3000`. The action then runs your suite in runs of two test files, each with a fresh start of the app it owns (your config's webServer is not used), after one run with no tests, and records what the app ran for each file's tests. Costs one app start, reset, global setup and setup-project run per two test files on those pushes; test-results/ keeps only the last run"
    required: false
  app-ready-url:
    description: "With app-start: the URL that answers 2xx once the app serves, e.g. http://localhost:3000/api/health"
    required: false
  app-reset:
    description: "With app-start: a command run before every one of those runs to put your app's state back (e.g. clone a seeded template database). PEEPS_INVOCATION is `ambient` for the first run, `spec` after, in its environment and in the tests'"
    required: false
  peeps-environment:
    description: "report mode: the Peeps environment whose Send to CI variables this run gets (e.g. dev). Each value is masked in the job log before anything runs; a variable the workflow sets itself wins. GitHub only. Runs Peeps starts get their environment's variables without it"
    required: false
  peeps-project:
    description: "With peeps-environment: the Peeps project's acronym, for a repository that backs more than one project with an environment of that name"
    required: false
  github-token:
    description: "Token for reading the pull request's deployments with preview (default: the job's GITHUB_TOKEN). The action removes it from its environment before anything runs, so test processes don't inherit it"
    required: false
    default: "${{ github.token }}"
runs:
  using: "node24"
  main: "dist/index.js"
