name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs write access to anything.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Node the action runs on (`action.yml`: node24). The load engine's
      # loader uses `module.registerHooks`, so its tests must run on that Node,
      # not whatever the runner image happens to ship.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm ci

      # Capture regressions execute the committed action with real Chromium.
      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      # The pytest path's tests run real pytest. Without this they would skip,
      # so PEEPS_REQUIRE_PYTEST turns a missing pytest into a failure.
      # (The runner's system Python refuses pip installs: PEP 668.)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install "pytest==9.1.1" "pytest-xdist==3.8.0" "pytest-rerunfailures==16.7" "requests==2.34.2" "httpx==0.28.1"

      - run: npm test
        env:
          PEEPS_REQUIRE_PYTEST: "1"

      # `uses: Peeps-Labs/peeps-action@<ref>` runs the COMMITTED dist/, not
      # src/. Anyone reading this repository to decide whether to trust it reads
      # src/, so the two have to be the same thing. Rebuild and fail if they
      # have drifted.
      - run: npm run build

      - name: dist/ matches src/
        run: git diff --exit-code -- dist/

      # `git diff` sees only tracked files: a new bundle the build writes but
      # nobody committed (dist/load.js, say) would pass it.
      - name: dist/ has no uncommitted bundle
        run: |
          status="$(git status --porcelain -- dist/)"
          if [ -n "$status" ]; then echo "$status"; exit 1; fi

  # The load engine's executor runs the customer's journey with the customer's
  # Playwright, inside whatever image their job uses. This runs the loader,
  # V2 and isolation tests against the COMMITTED dist/load-executor.js in
  # Playwright's stock image, as root in a container, with the fixtures inside
  # the checked-out workspace (the same tests also run in `check` above, on the
  # hosted runner).
  load-stock-image:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: node --version
      - run: node --test --import tsx test/load-loader.test.ts test/load-v2.test.ts test/load-isolation.test.ts
        env:
          PEEPS_LOAD_STOCK_IMAGE: "1"
