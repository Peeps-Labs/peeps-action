name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs write access to anything.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Node the action runs on (`action.yml`: node24), so the tests run on
      # that Node, not whatever the runner image happens to ship.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm ci

      # Capture regressions execute the committed action with real Chromium.
      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      # The pytest path's tests run real pytest. Without this they would skip,
      # so PEEPS_REQUIRE_PYTEST turns a missing pytest into a failure.
      # (The runner's system Python refuses pip installs: PEP 668.)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install "pytest==9.1.1" "pytest-xdist==3.8.0" "pytest-rerunfailures==16.7" "requests==2.34.2" "httpx==0.28.1"

      - run: npm test
        env:
          PEEPS_REQUIRE_PYTEST: "1"

      # `uses: Peeps-Labs/peeps-action@<ref>` runs the COMMITTED dist/, not
      # src/. Anyone reading this repository to decide whether to trust it reads
      # src/, so the two have to be the same thing. Rebuild and fail if they
      # have drifted.
      - run: npm run build

      - name: dist/ matches src/
        run: git diff --exit-code -- dist/

      # `git diff` sees only tracked files: a new bundle the build writes but
      # nobody committed would pass it.
      - name: dist/ has no uncommitted bundle
        run: |
          status="$(git status --porcelain -- dist/)"
          if [ -n "$status" ]; then echo "$status"; exit 1; fi

  # The load jail on the runners customers use (plan v3 §9): real sudo, systemd
  # and cgroup v2. Other jobs skip load-jail.test.ts.
  load-jail:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - run: node --test --import tsx test/load-jail.test.ts
        env:
          LOAD_JAIL_TESTS: "1"
