name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs write access to anything.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No setup-node step: the runner's own Node is recent enough for esbuild,
      # tsc and tsx, and pinning a version here would say nothing useful about
      # the Node the action itself runs on, which `action.yml` decides.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # `uses: Peeps-Labs/peeps-action@<ref>` runs the COMMITTED dist/, not
      # src/. Anyone reading this repository to decide whether to trust it reads
      # src/, so the two have to be the same thing. Rebuild and fail if they
      # have drifted.
      - run: npm run build

      - name: dist/ matches src/
        run: git diff --exit-code -- dist/
